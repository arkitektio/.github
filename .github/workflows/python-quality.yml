name: Python quality

# The arkitekt Python standard, checked: ruff lint, ruff format and basedpyright
# against the repo's baseline. Every check is required. A repo calls it with
#
#   jobs:
#     quality:
#       uses: arkitektio/.github/.github/workflows/python-quality.yml@main
#
# and keeps its config in sync with `python/sync_quality.py` (ruff and
# basedpyright are pinned in its dev group, so the lockfile decides versions).

on:
  workflow_call:
    inputs:
      python-version:
        description: The Python the project is installed with.
        type: string
        default: "3.12"
      sync-args:
        description: Extra arguments to `uv sync` (e.g. extras a typecheck needs).
        type: string
        default: "--all-extras --dev"

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install the project
        run: uv sync ${{ inputs.sync-args }}
      - name: Lint
        run: uv run --no-sync ruff check --output-format github .
      - name: Format
        run: uv run --no-sync ruff format --check .

  basedpyright:
    name: basedpyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install the project
        run: uv sync ${{ inputs.sync-args }}
      # Errors listed in .basedpyright/baseline.json predate the standard and
      # are tolerated; any other fails. Fixing one shrinks the baseline
      # (`basedpyright --writebaseline`), and it never grows back.
      - name: Typecheck
        run: uv run --no-sync basedpyright
